# FunCombat Configuration
reduce-knockback: true

# Configuración de knockback para golpes NORMALES
normal-knockback:
  cancel: true   # true = sin knockback, false = knockback normal

# Configuración de knockback para golpes CRÍTICOS
critical-knockback:
  cancel: true   # true = sin knockback, false = knockback normal

# ¿Mostrar mensajes de debug?
debug: false
