# FunCombat Configuration
reduce-knockback: true

# Configuración de knockback horizontal (lados)
horizontal-knockback:
  enabled: true
  multiplier: 0.2  # 20% del knockback normal

# Configuración de knockback vertical (arriba/abajo)
vertical-knockback:
  enabled: false   # Desactivar empuje vertical
  multiplier: 0.0  # Este valor no se usa cuando enabled: false

# Configuración específica para golpes críticos
critical-knockback:
  enabled: true   # Activar configuración específica para críticos
  horizontal-multiplier: 0.1  # 10% del knockback normal
  vertical-multiplier: 0.0    # 0% de empuje vertical

debug: true